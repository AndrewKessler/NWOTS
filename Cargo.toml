[package]
name = "NWOTS"
version = "0.1.0"
edition = "2024"

[dependencies]
glam = "0.30"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
image = "0.25"
winit = "0.29"
fontdue = "0.9"
pixels = "0.15"
rodio = "0.21"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
sha2 = "0.10"
hex = "0.4"